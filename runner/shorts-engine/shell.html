<link rel="stylesheet" href="assets/lane.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--ink); }
.scene, .part { position: absolute; inset: 0; overflow: hidden; }
.g-dark { background-color: var(--dark); color: var(--light); }
.g-light { background-color: var(--light); color: var(--ink); --accent-text: var(--accent-deep); }
:root { --accent-text: var(--accent); } /* text in the accent colour; fills keep --accent */
.g-accent { background-color: var(--accent); color: var(--ink); }
.pad { position: absolute; left: 72px; right: 72px; }
.accent { color: var(--accent); }
.fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
#caps { position: absolute; left: 72px; right: 72px; top: 1470px; height: 200px; z-index: 20; }
.cap { position: absolute; inset: 0; }
.cap span { opacity: 0.5; display: inline-block; }
.cap .num { color: var(--accent); }
#caps[data-ground="accent"] .num { color: var(--ink); }
#caps[data-ground="light"] .num { color: var(--accent-deep); }
#caps[data-photo="1"] .cap span { padding: 2px 11px 6px; margin-right: 0; } /* one joined plate per caption line */
#caps[data-photo="1"][data-ground="dark"] .cap span { background-color: rgba(11, 11, 11, 0.78); }
#caps[data-photo="1"][data-ground="light"] .cap span { background-color: rgba(240, 239, 234, 0.85); }
#grain { position: absolute; inset: 0; z-index: 30; background: url("assets/grain.png"); opacity: 0.075; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
  <audio id="vo" src="voice.mp3" data-start="0" data-volume="1"></audio>
  <audio id="bed" src="sfx.wav" data-start="0" data-volume="0.9"></audio>
  <div id="cam" style="position:absolute;inset:0"></div>
  <div id="caps"></div>
  <div id="grain"></div>
</div>
<script src="assets/driver.js"></script>
<script>
  // build once the lane's display font is loaded, so text is measured in the real face
  document.fonts.load(window.LANE.font).then(() => { window.__timelines["main"] = window.buildShort(); })
    .catch((e) => setTimeout(() => { throw e; })); // surface build errors as page errors
</script>
</body>
