# Generated by `npm run runner:export` in autobiz-manager. Re-export instead of editing by hand.
name: "Cartoon Clips Shorts"
on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Europe/London'
    - cron: '17 15 * * *'
      timezone: 'Europe/London'
    - cron: '17 21 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:
concurrency:
  group: cartoon-clips-shorts
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install tools
        run: |
          pipx install "yt-dlp[default]==2026.08.19"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-roboto-unhinted privoxy > /dev/null
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.112
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --prefix runner --no-audit --no-fund
          npx --prefix runner playwright install --with-deps chromium
      - name: Start Cloudflare WARP for yt-dlp
        run: bash runner/warp.sh start
      - uses: actions/cache/restore@v4
        with:
          path: data/state
          key: state-cartoon-clips-shorts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-cartoon-clips-shorts-
      - name: Write credentials for EpicVideoClips101
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_EPICVIDEOCLIPS101 }}
        run: |
          umask 077
          mkdir -p data/state/youtube-tokens
          printf '%s' "$YOUTUBE_TOKEN" > data/state/youtube-tokens/EpicVideoClips101.json
      - name: "Run Cartoon Clips Shorts"
        env:
          AUTOBIZ_RUN_TIMEOUT_MS: '3600000'
          AGENT_CLI: claude
          AGENT_MODEL: claude-haiku-5-5
          AGENT_TIMEOUT_MS: '180000'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YOUTUBE_DATA_API_CLIENT_ID: ${{ secrets.YOUTUBE_DATA_API_CLIENT_ID }}
          YOUTUBE_DATA_API_CLIENT_SECRET: ${{ secrets.YOUTUBE_DATA_API_CLIENT_SECRET }}
        run: node runner/runner.mjs businesses/cartoon-clips-shorts/business.json --data data --attempts 3 --between "bash runner/warp.sh rotate"
      - name: Forget credentials and browser caches before saving state
        if: always()
        run: |
          rm -rf data/state/youtube-tokens data/studio-cookies.sqlite
          find data/state -type d \( -name Cache -o -name 'Code Cache' -o -name GPUCache -o -name CacheStorage \) -prune -exec rm -rf {} + 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/state
          key: state-cartoon-clips-shorts-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-cartoon-clips-shorts-${{ github.run_id }}
          path: |
            data/runs
            data/artifacts
            !data/artifacts/*/section.*
            !data/artifacts/*/download.*
          retention-days: 7
          if-no-files-found: warn
