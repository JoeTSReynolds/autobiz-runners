# Generated by `npm run scout:export` in autobiz-manager. Re-export instead of editing by hand.
name: "Campaign scout"
on:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:
    inputs:
      join:
        description: Join and draft campaigns (off is a dry run)
        type: boolean
        default: false
concurrency:
  group: campaign-scout
  cancel-in-progress: false
permissions:
  contents: write # only the Save live campaigns step gets the token
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check Claude is available
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.112
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          (timeout 120 "$HOME/.local/bin/claude" -p 'Reply with OK' --model claude-haiku-5-5 > "$RUNNER_TEMP/claude-check.log" 2>&1; echo $? > "$RUNNER_TEMP/claude-check.status") < /dev/null > /dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: runner/node_modules
          key: tools-runner-node24-${{ hashFiles('runner/package.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install tools
        run: if [ ! -d runner/node_modules ]; then npm install --prefix runner --no-audit --no-fund; fi
      - name: Confirm Claude is available
        run: |
          for _ in $(seq 1 130); do [ -s "$RUNNER_TEMP/claude-check.status" ] && break; sleep 1; done
          if [ "$(cat "$RUNNER_TEMP/claude-check.status" 2>/dev/null)" != 0 ]; then
            echo "::error::Claude is not available: $(tail -c 300 "$RUNNER_TEMP/claude-check.log" 2>/dev/null)"
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: data/scout
          key: scout/${{ github.run_id }}
          restore-keys: |
            scout/
      - name: Write Content Rewards session
        env:
          CR_SESSION: ${{ secrets.CR_SESSION }}
        run: |
          if [ -n "$CR_SESSION" ]; then
            (umask 077; printf '%s' "$CR_SESSION" > "$RUNNER_TEMP/cr-session.json")
          fi
      - name: Scout campaigns
        env:
          CR_SESSION_FILE: ${{ runner.temp }}/cr-session.json
          CR_CHROME: /usr/bin/google-chrome
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCOUT_MODEL: claude-haiku-5-5
          SCOUT_GAMING: '1' # 0 skips gaming/stream campaigns (joins and drafts them for GamingClippyHQ)
          SCOUT_AUTO: campaigns/auto.json
          SCOUT_JOIN: ${{ (github.event_name == 'schedule' || inputs.join) && '1' || '0' }}
        run: node runner/cr-scout.mjs
      - name: Save live campaigns
        if: always() && (github.event_name == 'schedule' || inputs.join)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          [ -f campaigns/auto.json ] || exit 0
          git add campaigns/auto.json
          git diff --cached --quiet && exit 0
          git -c user.name='campaign-scout' -c user.email='campaign-scout@users.noreply.github.com' commit -q -m 'Scout: update live campaigns'
          remote="https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          for _ in 1 2 3; do
            git -c user.name='campaign-scout' -c user.email='campaign-scout@users.noreply.github.com' pull -q --rebase "$remote" "$BRANCH" && git push -q "$remote" "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          exit 1
      - name: Report in the job summary
        if: always()
        run: if [ -f scout-out/report.txt ]; then cat scout-out/report.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proposed-campaigns
          path: scout-out/proposed
          if-no-files-found: ignore
          retention-days: 30
      - name: Notify the phone
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ] && [ -f scout-out/report.txt ]; then
            curl -fsS -H "Title: Campaign scout" --data-binary @scout-out/report.txt "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || echo "::warning::ntfy post failed"
          fi
