# Generated by `npm run runner:export` in autobiz-manager. Re-export instead of editing by hand.
name: "Newsroom Space"
on:
  schedule:
    - cron: '37 11 * * *'
      timezone: 'Europe/London'
    - cron: '37 21 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:
concurrency:
  group: newsroom-space
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check YouTube token for JTSRScience
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JTSRSCIENCE }}
          CLIENT_ID: ${{ secrets.YOUTUBE_DATA_API_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_DATA_API_CLIENT_SECRET }}
        run: |
          response=$(curl -sS --retry 3 https://oauth2.googleapis.com/token -d grant_type=refresh_token \
            --data-urlencode "client_id=$CLIENT_ID" --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$(printf '%s' "$YOUTUBE_TOKEN" | jq -r .refresh_token)")
          if ! printf '%s' "$response" | jq -e .access_token > /dev/null 2>&1; then
            echo "::error::Google rejected the YouTube token for @JTSRScience: $(printf '%s' "$response" | jq -c '{error, error_description}' 2>/dev/null). Run npm run youtube:authorize -- @JTSRScience in autobiz-manager, then update the YOUTUBE_TOKEN_JTSRSCIENCE secret."
            exit 1
          fi
      - name: Check Claude is available
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.112
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          (timeout 120 "$HOME/.local/bin/claude" -p 'Reply with OK' --model claude-haiku-5-5 > "$RUNNER_TEMP/claude-check.log" 2>&1; echo $? > "$RUNNER_TEMP/claude-check.status") < /dev/null > /dev/null 2>&1 &
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: apt-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/autobiz/apt
          key: tools-apt-2908cc0a4955-${{ steps.apt-week.outputs.week }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/autobiz/ffmpeg
          key: tools-ffmpeg-n8.1-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/cache@v4
        with:
          path: runner/node_modules
          key: tools-runner-node24-${{ hashFiles('runner/package.json') }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: tools-playwright-${{ hashFiles('runner/package.json') }}-${{ runner.os }}
      - name: Install tools
        timeout-minutes: 10
        run: |
          a="$HOME/.cache/autobiz/apt"
          mkdir -p "$a/archives/partial" "$a/lists/partial"
          APT="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 -o DPkg::Lock::Timeout=180 -o Dir::Cache::Archives=$a/archives -o Dir::State::Lists=$a/lists"
          PKGS='fonts-roboto-unhinted espeak-ng xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2'
          # A cache hit installs from the cached lists and packages without the mirror; a miss or a stale cache updates first.
          if ! sudo apt-get $APT install -y -qq --no-download $PKGS > /dev/null 2>&1; then
            sudo apt-get $APT update -qq
            sudo apt-get $APT install -y -qq $PKGS > /dev/null
          fi
          sudo chown -R "$(id -u):$(id -g)" "$a"
          ff="$HOME/.cache/autobiz/ffmpeg"
          if [ ! -x "$ff/bin/ffmpeg" ]; then
            mkdir -p "$ff" && curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ --strip-components=1 -C "$ff" || { rm -rf "$ff"; sudo apt-get $APT install -y -qq ffmpeg > /dev/null; }
          fi
          if [ -x "$ff/bin/ffmpeg" ]; then echo "$ff/bin" >> "$GITHUB_PATH"; fi
          if [ ! -d runner/node_modules ]; then npm install --prefix runner --no-audit --no-fund; fi
          npx --prefix runner playwright install chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: shorts-kokoro-82m-v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            ~/.npm/_npx
          key: shorts-hyperframes-0.8.174-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path: .venv-shorts
          key: shorts-venv-py3.12-torch-2.11.0-kokoro-0.9.4-misaki-0.9.4-numpy-2.5.3-sm-3.8.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install shorts tools
        run: |
          if [ ! -x .venv-shorts/bin/python ]; then
            python3.12 -m venv .venv-shorts
            .venv-shorts/bin/pip install --quiet torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
            .venv-shorts/bin/pip install --quiet kokoro==0.9.4 misaki==0.9.4 numpy==2.5.3 https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          fi
          npx --yes hyperframes@0.8.174 browser ensure
      - name: Confirm Claude is available
        run: |
          for _ in $(seq 1 130); do [ -s "$RUNNER_TEMP/claude-check.status" ] && break; sleep 1; done
          if [ "$(cat "$RUNNER_TEMP/claude-check.status" 2>/dev/null)" != 0 ]; then
            echo "::error::Claude is not available: $(tail -c 300 "$RUNNER_TEMP/claude-check.log" 2>/dev/null)"
            exit 1
          fi
      - uses: actions/cache/restore@v4
        with:
          path: data/state
          key: state-newsroom-space-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-newsroom-space-
      - name: Restore business assets
        run: mkdir -p data/state/businesses/b65c0aeb-3200-4470-b938-96e8be0f45d9 && cp -Rn businesses/newsroom-space/seed/. data/state/businesses/b65c0aeb-3200-4470-b938-96e8be0f45d9/
      - name: Write credentials for JTSRScience
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JTSRSCIENCE }}
        run: |
          umask 077
          mkdir -p data/state/youtube-tokens
          printf '%s' "$YOUTUBE_TOKEN" > data/state/youtube-tokens/JTSRScience.json
      - name: "Run Newsroom Space"
        env:
          AUTOBIZ_RUN_TIMEOUT_MS: '3600000'
          AGENT_CLI: claude
          AGENT_MODEL: claude-haiku-5-5
          AGENT_TIMEOUT_MS: '180000'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YOUTUBE_DATA_API_CLIENT_ID: ${{ secrets.YOUTUBE_DATA_API_CLIENT_ID }}
          YOUTUBE_DATA_API_CLIENT_SECRET: ${{ secrets.YOUTUBE_DATA_API_CLIENT_SECRET }}
          AUTOBIZ_PYTHON: ${{ github.workspace }}/.venv-shorts/bin/python
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEWSROOM_SITE_CLOUDFLARE_PROJECT: ${{ secrets.NEWSROOM_SITE_CLOUDFLARE_PROJECT }}
        run: node runner/runner.mjs businesses/newsroom-space/business.json --data data
      - name: Forget credentials and browser caches before saving state
        if: always()
        run: |
          rm -rf data/state/youtube-tokens data/state/instagram-tokens data/studio-cookies.sqlite
          find data/state -type d \( -name Cache -o -name 'Code Cache' -o -name GPUCache -o -name CacheStorage \) -prune -exec rm -rf {} + 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/state
          key: state-newsroom-space-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-newsroom-space-${{ github.run_id }}
          path: |
            data/runs
            data/artifacts
            !data/artifacts/*/section.*
            !data/artifacts/*/download.*
          retention-days: 7
          if-no-files-found: warn
