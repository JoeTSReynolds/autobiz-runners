# Temporary diagnostic (2026-10-23): why NoWayClips section downloads stall in the cloud. Delete after one run.
name: "Debug yt-dlp sections"
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install tools
        run: |
          bash runner/warp.sh repo
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg privoxy cloudflare-warp > /dev/null
          mkdir -p "$HOME/btbn" && curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ --strip-components=1 -C "$HOME/btbn"
          pipx install "yt-dlp[default]==2026.08.19"
          pipx inject yt-dlp "bgutil-ytdlp-pot-provider==2.0.2"
          /usr/bin/ffmpeg -version | head -1; "$HOME/btbn/bin/ffmpeg" -version | head -1
      - name: Start WARP and the PO token provider
        run: |
          bash runner/warp.sh start
          docker run -d --init --network host --name bgutil brainicism/bgutil-ytdlp-pot-provider:2.0.2-node
          sleep 5
      - name: Write yt-dlp cookies
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          umask 077
          printf '%s' "$YTDLP_COOKIES" | base64 -d | gunzip > "$RUNNER_TEMP/yt-cookies.txt"
      - name: Probe section downloads
        run: |
          F='bv*[height<=1080][vcodec^=avc1][protocol^=m3u8]+ba/bv*[height<=1080][vcodec^=avc1]+ba/b[height<=1080]'
          U='https://www.youtube.com/watch?v=Put_ebpxQXU'
          C="$RUNNER_TEMP/yt-cookies.txt"
          probe() {
            name=$1; shift
            dir="$RUNNER_TEMP/$name"; mkdir -p "$dir"; cd "$dir"
            start=$(date +%s)
            timeout 90 yt-dlp "$@" -f "${FMT:-$F}" --download-sections '*2423-2445' --force-keyframes-at-cuts --merge-output-format mp4 \
              --print 'before_dl:format %(format_id)s %(protocol)s' -o 'clip.%(ext)s' --no-warnings --no-simulate -- "$U" > out.txt 2> err.txt
            code=$?
            bytes=$(du -cb clip.* 2>/dev/null | tail -1 | cut -f1)
            echo "RESULT $name exit=$code seconds=$(( $(date +%s) - start )) bytes=${bytes:-0} $(cat out.txt | tr '\n' ' ')"
            tail -c 400 err.txt | tr '\n' ' '; echo
            cd - > /dev/null
          }
          probe btbn-proxy-cookies --ffmpeg-location "$HOME/btbn/bin" --cookies "$C"
          probe btbn-proxy-nocookies --ffmpeg-location "$HOME/btbn/bin"
          probe apt-proxy-cookies --ffmpeg-location /usr/bin --cookies "$C"
          probe btbn-direct-cookies --ffmpeg-location "$HOME/btbn/bin" --cookies "$C" --proxy ''
          probe btbn-direct-nocookies --ffmpeg-location "$HOME/btbn/bin" --proxy ''
          FMT='bv*[height<=1080][vcodec^=avc1][protocol=https]+ba[protocol=https]/b[protocol=https]' probe btbn-proxy-cookies-https --ffmpeg-location "$HOME/btbn/bin" --cookies "$C"
