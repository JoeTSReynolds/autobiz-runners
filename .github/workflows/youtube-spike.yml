# Throwaway check: is Cloudflare WARP a reliable way past YouTube's bot check on GitHub-hosted runners?
# Run 1 (38072648315): no proxy, captions + section blocked 3/3.
# Run 2 (38072792827): player clients and bgutil alone blocked; warp and warp+bgutil passed.
# Run 3: WARP only, the business's full search -> captions -> section flow, 4 runners, different shows.
name: youtube-spike
on: push
env:
  FORMAT: 'bv*[height<=1080][vcodec^=avc1][protocol^=m3u8]+ba/bv*[height<=1080][vcodec^=avc1]+ba/b[height<=1080]'
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - query: UCgPClNr5VSYC3syrDUIlzLw/search?query=Rick%20and%20Morty
          - query: UC1MEMnZEDKqLPu-B-AHIsyw/search?query=Family%20Guy
          - query: UCE5mQnNl8Q4H2qcv4ikaXeA/search?query=Futurama
          - query: UC7fZ-QNFi7amcOncIl6owxA/search?query=South%20Park
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp, ffmpeg, WARP and privoxy
        run: |
          pipx install "yt-dlp[default]==2026.08.19"
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg cloudflare-warp privoxy > /dev/null
          warp-cli --accept-tos registration new && warp-cli --accept-tos mode proxy && warp-cli --accept-tos connect
          echo 'forward-socks5t / 127.0.0.1:40000 .' | sudo tee -a /etc/privoxy/config > /dev/null
          sudo systemctl restart privoxy
          for i in $(seq 1 20); do curl -sf -x http://127.0.0.1:8118 https://www.cloudflare.com/cdn-cgi/trace > trace.txt && break; sleep 1; done
          grep -E '^(ip|warp|colo)=' trace.txt
      - name: Search, captions, section
        run: |
          P="--proxy http://127.0.0.1:8118"
          yt-dlp $P --flat-playlist -J --no-warnings --playlist-end 20 -- "https://www.youtube.com/channel/${{ matrix.query }}" > search.json
          id=$(jq -r '[.entries[] | select(.duration != null and .duration >= 120 and .duration <= 3600)][0].id // empty' search.json)
          echo "picked $id"
          yt-dlp $P --skip-download --write-subs --write-auto-subs --sub-langs en,en-orig,en-US --sub-format json3 -o captions --no-warnings -- "https://www.youtube.com/watch?v=$id" > /dev/null
          ls captions*
          yt-dlp $P -f "$FORMAT" --download-sections '*30-90' --force-keyframes-at-cuts --merge-output-format mp4 -o 'section.%(ext)s' --no-warnings -- "https://www.youtube.com/watch?v=$id" > /dev/null 2>&1
          echo "RESULT ok $(ffprobe -v error -show_entries format=duration:stream=codec_type -of json section.mp4 | jq -c '{d: .format.duration, s: [.streams[].codec_type]}')"
