# Throwaway check: which free workaround gets a GitHub-hosted runner past YouTube's bot check?
# Run 1 (38072648315): search worked; captions and section download hit "Sign in to confirm you're not a bot" on 3/3 runners.
name: youtube-spike
on: push
env:
  VIDEO: https://www.youtube.com/watch?v=c2lla70AYz8
  FORMAT: 'bv*[height<=1080][vcodec^=avc1][protocol^=m3u8]+ba/bv*[height<=1080][vcodec^=avc1]+ba/b[height<=1080]'
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [tv, tv_simply, android_vr, web_safari, mweb, bgutil, warp, warp-bgutil]
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp 2026.08.19 and ffmpeg
        run: |
          pipx install "yt-dlp[default]==2026.08.19"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Player client args
        if: ${{ !contains(matrix.variant, 'bgutil') && !contains(matrix.variant, 'warp') }}
        run: echo "EXTRA=--extractor-args youtube:player_client=${{ matrix.variant }}" >> "$GITHUB_ENV"
      - name: Start bgutil PO-token provider
        if: contains(matrix.variant, 'bgutil')
        run: |
          docker run -d --name bgutil -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          pipx inject yt-dlp bgutil-ytdlp-pot-provider
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4416/ping && break; sleep 1; done; echo
      - name: Start Cloudflare WARP (SOCKS) behind privoxy (HTTP, so ffmpeg can use it)
        if: contains(matrix.variant, 'warp')
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp privoxy > /dev/null
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 5
          echo 'forward-socks5t / 127.0.0.1:40000 .' | sudo tee -a /etc/privoxy/config > /dev/null
          sudo systemctl restart privoxy; sleep 2
          curl -s -x http://127.0.0.1:8118 https://ipinfo.io/json | jq '{ip, org}'
          echo "PROXY=--proxy http://127.0.0.1:8118" >> "$GITHUB_ENV"
      - name: Captions
        id: captions
        continue-on-error: true
        run: |
          yt-dlp $EXTRA $PROXY --skip-download --write-subs --write-auto-subs --sub-langs en,en-orig,en-US --sub-format json3 -o captions --no-warnings -- "$VIDEO"
          ls captions*
      - name: Section download
        id: section
        continue-on-error: true
        run: |
          yt-dlp $EXTRA $PROXY -f "$FORMAT" --download-sections '*30-90' --force-keyframes-at-cuts --merge-output-format mp4 -o 'section.%(ext)s' --no-warnings -- "$VIDEO"
          ffprobe -v error -show_entries format=duration -of csv=p=0 section.mp4
      - name: Result
        run: echo "RESULT ${{ matrix.variant }} captions=${{ steps.captions.outcome }} section=${{ steps.section.outcome }}"
