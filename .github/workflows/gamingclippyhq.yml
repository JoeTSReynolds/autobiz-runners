# Generated by `npm run runner:export` in autobiz-manager. Re-export instead of editing by hand.
name: "GamingClippyHQ"
on:
  schedule:
    - cron: '41 9 * * *'
      timezone: 'Europe/London'
    - cron: '41 13 * * *'
      timezone: 'Europe/London'
    - cron: '11 17 * * *'
      timezone: 'Europe/London'
    - cron: '41 20 * * *'
      timezone: 'Europe/London'
    - cron: '11 23 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:
concurrency:
  group: gamingclippyhq
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check YouTube token for GamingClippyHQ
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_GAMINGCLIPPYHQ }}
          CLIENT_ID: ${{ secrets.YOUTUBE_DATA_API_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_DATA_API_CLIENT_SECRET }}
        run: |
          response=$(curl -sS --retry 3 https://oauth2.googleapis.com/token -d grant_type=refresh_token \
            --data-urlencode "client_id=$CLIENT_ID" --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$(printf '%s' "$YOUTUBE_TOKEN" | jq -r .refresh_token)")
          if ! printf '%s' "$response" | jq -e .access_token > /dev/null 2>&1; then
            echo "::error::Google rejected the YouTube token for @GamingClippyHQ: $(printf '%s' "$response" | jq -c '{error, error_description}' 2>/dev/null). Run npm run youtube:authorize -- @GamingClippyHQ in autobiz-manager, then update the YOUTUBE_TOKEN_GAMINGCLIPPYHQ secret."
            exit 1
          fi
      - name: Check Claude is available
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.112
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          (timeout 120 "$HOME/.local/bin/claude" -p 'Reply with OK' --model claude-haiku-5-5 > "$RUNNER_TEMP/claude-check.log" 2>&1; echo $? > "$RUNNER_TEMP/claude-check.status") < /dev/null > /dev/null 2>&1 &
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - id: apt-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/autobiz/apt
          key: tools-apt-dde914990a19-${{ steps.apt-week.outputs.week }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/autobiz/pipx
          key: tools-pipx-yt-dlp-2026.10.26-bgutil-2.0.2-whisper-0.5.8-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/cache@v4
        with:
          path: runner/node_modules
          key: tools-runner-node24-${{ hashFiles('runner/package.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install tools
        timeout-minutes: 10
        run: |
          (docker pull -q brainicism/bgutil-ytdlp-pot-provider:2.0.2-node > /dev/null 2>&1 &)
          bash runner/warp.sh repo
          a="$HOME/.cache/autobiz/apt"
          mkdir -p "$a/archives/partial" "$a/lists/partial"
          APT="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 -o DPkg::Lock::Timeout=180 -o Dir::Cache::Archives=$a/archives -o Dir::State::Lists=$a/lists"
          PKGS='fonts-roboto-unhinted ffmpeg privoxy cloudflare-warp fonts-noto-color-emoji fonts-unifont xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf'
          # A cache hit installs from the cached lists and packages without the mirror; a miss or a stale cache updates first.
          if ! sudo apt-get $APT install -y -qq --no-download $PKGS > /dev/null 2>&1; then
            sudo apt-get $APT update -qq
            sudo apt-get $APT install -y -qq $PKGS > /dev/null
          fi
          sudo chown -R "$(id -u):$(id -g)" "$a"
          export PIPX_HOME="$HOME/.cache/autobiz/pipx" PIPX_BIN_DIR="$HOME/.cache/autobiz/pipx/bin"
          if [ ! -x "$PIPX_BIN_DIR/yt-dlp" ]; then
            pipx install "yt-dlp[default]==2026.10.26"
            pipx inject yt-dlp "bgutil-ytdlp-pot-provider==2.0.2"
            pipx install "whisper-ctranslate2==0.5.8"
          fi
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          if [ ! -d runner/node_modules ]; then npm install --prefix runner --no-audit --no-fund; fi
      - uses: actions/cache@v4
        with:
          path: .venv-video
          key: video-venv-py3.12-numpy-2.5.3-opencv-python-headless-5.0.0.93-pillow-12.3.0-sherpa-onnx-2.0.3-${{ runner.os }}-${{ runner.arch }}
      - name: Install video tools
        run: |
          if [ ! -x .venv-video/bin/python ]; then
            python3.12 -m venv .venv-video
            .venv-video/bin/pip install --quiet numpy==2.5.3 opencv-python-headless==5.0.0.93 pillow==12.3.0 sherpa-onnx==2.0.3
          fi
      - name: Start Cloudflare WARP for yt-dlp
        run: bash runner/warp.sh start
      - name: Start the PO token provider for yt-dlp
        run: docker run -d --init --network host --name bgutil brainicism/bgutil-ytdlp-pot-provider:2.0.2-node
      - name: Confirm Claude is available
        run: |
          for _ in $(seq 1 130); do [ -s "$RUNNER_TEMP/claude-check.status" ] && break; sleep 1; done
          if [ "$(cat "$RUNNER_TEMP/claude-check.status" 2>/dev/null)" != 0 ]; then
            echo "::error::Claude is not available: $(tail -c 300 "$RUNNER_TEMP/claude-check.log" 2>/dev/null)"
            exit 1
          fi
      - uses: actions/cache/restore@v4
        with:
          path: data/state
          key: state/gamingclippyhq/${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            state/gamingclippyhq/
            state-gamingclippyhq-4
      - name: Restore business assets
        run: mkdir -p data/state/businesses/d0322bd9-69ec-4b89-bfcb-24d23f6f09f7 && cp -R businesses/gamingclippyhq/state/. data/state/businesses/d0322bd9-69ec-4b89-bfcb-24d23f6f09f7/
      - name: Write credentials for GamingClippyHQ
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_GAMINGCLIPPYHQ }}
        run: |
          umask 077
          mkdir -p data/state/youtube-tokens
          printf '%s' "$YOUTUBE_TOKEN" > data/state/youtube-tokens/GamingClippyHQ.json
      - name: Write Instagram credentials for gamingclippyhq
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN_GAMINGCLIPPYHQ }}
        run: |
          umask 077
          mkdir -p data/state/instagram-tokens
          printf '%s' "$INSTAGRAM_TOKEN" > data/state/instagram-tokens/gamingclippyhq.json
      - name: Write yt-dlp cookies
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            umask 077
            printf '%s' "$YTDLP_COOKIES" | base64 -d | gunzip > "$RUNNER_TEMP/yt-cookies.txt"
            echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"
          fi
      - name: Write Content Rewards session
        env:
          CR_SESSION: ${{ secrets.CR_SESSION }}
        run: |
          if [ -n "$CR_SESSION" ]; then
            (umask 077; printf '%s' "$CR_SESSION" > "$RUNNER_TEMP/cr-session.json")
          fi
      - name: "Run GamingClippyHQ"
        env:
          AUTOBIZ_RUN_TIMEOUT_MS: '3600000'
          AUTOBIZ_NETWORK_RESET_COMMAND: bash runner/warp.sh rotate
          AGENT_CLI: claude
          AGENT_MODEL: claude-haiku-5-5
          AGENT_TIMEOUT_MS: '180000'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YOUTUBE_DATA_API_CLIENT_ID: ${{ secrets.YOUTUBE_DATA_API_CLIENT_ID }}
          YOUTUBE_DATA_API_CLIENT_SECRET: ${{ secrets.YOUTUBE_DATA_API_CLIENT_SECRET }}
          AUTOBIZ_PUBLISHED_FILE: ${{ runner.temp }}/published.json
          CR_SESSION_FILE: ${{ runner.temp }}/cr-session.json
          AUTOBIZ_PYTHON: ${{ github.workspace }}/.venv-video/bin/python
        run: node runner/runner.mjs businesses/gamingclippyhq/business.json --data data
      - name: Submit to Content Rewards
        if: always()
        continue-on-error: true
        env:
          CR_SESSION: ${{ secrets.CR_SESSION }}
          CR_CAMPAIGN_URL: "https://contentrewards.com/c/campaigns/5f22a72a-9598-4d10-897e-e16ebc97ff0e"
          PUBLISHED: ${{ runner.temp }}/published.json
          CR_SESSION_FILE: ${{ runner.temp }}/cr-session.json
          CR_RESULT_FILE: ${{ runner.temp }}/cr-result.json
          CR_SHOTS_DIR: ${{ runner.temp }}/cr-shots
          CR_CHROME: /usr/bin/google-chrome
        run: |
          if [ -z "$CR_SESSION" ] || [ ! -f "$PUBLISHED" ]; then exit 0; fi
          node runner/cr-submit.mjs
      - name: Notify the phone
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_LINK: "https://contentrewards.com/c/campaigns/5f22a72a-9598-4d10-897e-e16ebc97ff0e"
          PUBLISHED: ${{ runner.temp }}/published.json
          RESULT: ${{ runner.temp }}/cr-result.json
        run: |
          if [ -z "$NTFY_TOPIC" ] || [ ! -f "$PUBLISHED" ]; then exit 0; fi
          [ -f "${RESULT:-}" ] || RESULT=/dev/null
          jq -r --slurpfile r "$RESULT" '($r[0] // []) as $s | .[] | . as $i | ([$s[] | select(.url == $i.url)] | first) as $x | [.platform, .url, (if $x == null then "-" elif $x.submitted then "ok" else "no:" + ($x.reason // "unknown") end), ((.campaign // "") | if type == "string" and test("^https://contentrewards\\.com/c/campaigns/[0-9a-f-]{36}$"; "i") then . else "-" end), (.title // "")] | map(gsub("[[:cntrl:]]"; " ")) | join("	")' "$PUBLISHED" | while IFS=$'	' read -r platform url status campaign title; do
            case "$url" in https://*) ;; *) continue ;; esac
            link="$NOTIFY_LINK"; [ "$campaign" = - ] || link="$campaign"
            case "$status" in
              ok) body="$platform $url — auto-submitted ✅" ;;
              no:*) body="$platform $url — NOT submitted (${status#no:}), submit within 30 min" ;;
              *) body="$platform $url — submit within 30 min" ;;
            esac
            curl -fsS -H "Title: New Short: $title" -H "Click: $url" -H "Actions: view, Submit clip, $link" -H "Priority: high" -d "$body" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || echo "::warning::ntfy post failed for $url"
          done
      - name: Forget credentials and browser caches before saving state
        if: always()
        run: |
          rm -rf data/state/youtube-tokens data/state/instagram-tokens data/studio-cookies.sqlite
          rm -f "$RUNNER_TEMP/cr-session.json"
          find data/state -type d \( -name Cache -o -name 'Code Cache' -o -name GPUCache -o -name CacheStorage \) -prune -exec rm -rf {} + 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/state
          key: state/gamingclippyhq/${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-gamingclippyhq-${{ github.run_id }}
          path: |
            data/runs
            data/artifacts
            !data/artifacts/*/section.*
            !data/artifacts/*/download.*
          retention-days: 7
          if-no-files-found: warn
